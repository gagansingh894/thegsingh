services:
  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

  tgs-backend:
    build:
      context: .
      dockerfile: build/Dockerfile.backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis