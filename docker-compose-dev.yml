services:
  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  tgs-backend-dev:
    build:
      context: .
      dockerfile: build/Dockerfile.backend-dev
    restart: always
    ports:
      - "8080:8080"
    environment:
      - RESEND_API_KEY=${RESEND_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - REDIS_URL=redis://redis:6379
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - redis
      - ollama

volumes:
  ollama_data: