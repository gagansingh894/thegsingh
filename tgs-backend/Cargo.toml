[package]
name = "tgs-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.6"
strum = { version = "0.28.0", features = ["derive"] }
tokio = {version = "1", features = ["full"]}
async-trait = "0.1.87"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
resend-rs = "0.25.1"
rig  = { version = "0.37.1"}
redis = { version = "1.0.4", features = ["tokio-comp"] }
deadpool-redis = { version =  "0.23.0", features = ["rt_tokio_1"] }